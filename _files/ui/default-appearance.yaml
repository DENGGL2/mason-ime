# rime-mini-ui: system
# 麻绳输入法双主题外观；其他输入偏好保持原配置。

patch:
  style/color_scheme: mini_graphite_light
  style/color_scheme_dark: mini_graphite_dark
  style/font_face: Microsoft YaHei UI
  style/label_font_face: Microsoft YaHei UI
  style/comment_font_face: Microsoft YaHei UI
  style/font_point: 14
  style/label_font_point: 11
  style/comment_font_point: 12
  style/horizontal: false
  style/inline_preedit: false
  style/preedit_type: composition
  style/label_format: '%s'
  style/mark_text: ''
  style/layout/border_width: 1
  style/layout/margin_x: 12
  style/layout/margin_y: 10
  style/layout/spacing: 10
  style/layout/candidate_spacing: 6
  style/layout/hilite_spacing: 2
  style/layout/hilite_padding: 6
  style/layout/corner_radius: 10
  style/layout/round_corner: 7
  style/layout/shadow_radius: 5
  style/layout/shadow_offset_x: 0
  style/layout/shadow_offset_y: 2
  preset_color_schemes/mini_fluent_light:
    name: 晴空蓝 · 浅色
    color_format: abgr
    back_color: 0xffffff
    border_color: 0xefe5df
    shadow_color: 0x16000000
